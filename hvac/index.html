<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Dispatcher | Noir Systems</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* This fixes the shrunken logo issue */
        .logo a {
            font-size: inherit;
            font-weight: inherit;
            color: inherit;
            text-decoration: none;
            display: inline-block;
            line-height: normal;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px 8%;
        }
        .service-btn {
            background: #111;
            border: 1px solid var(--border);
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .service-btn:hover {
            border-color: var(--accent);
            background: #1a1a1a;
        }
        .demo-container {
            background: #000;
            padding: 60px 8%;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="/">NOIR<span>HVAC</span></a>
            </div>
            <ul>
                <li><a href="#heating">Heating</a></li>
                <li><a href="#cooling">Cooling</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#ai-dispatch" class="nav-cta">Book Now</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>24/7 Intelligent HVAC Dispatch</h1>
        <p>Select a service below to start a live vetting session with our AI Dispatcher.</p>
    </section>

    <div class="service-grid">
        <div class="service-btn" onclick="document.getElementById('voiceflow-hvac').scrollIntoView({behavior: 'smooth'})">
            🔥 <h3>Heating</h3>
        </div>
        <div class="service-btn" onclick="document.getElementById('voiceflow-hvac').scrollIntoView({behavior: 'smooth'})">
            ❄️ <h3>Cooling</h3>
        </div>
        <div class="service-btn" onclick="document.getElementById('voiceflow-hvac').scrollIntoView({behavior: 'smooth'})">
            🛠️ <h3>Install</h3>
        </div>
        <div class="service-btn" onclick="document.getElementById('voiceflow-hvac').scrollIntoView({behavior: 'smooth'})">
            🚨 <h3>Emergency</h3>
        </div>
    </div>

    <section id="ai-dispatch" class="demo-container">
        <h2>Live Simulation Lab</h2>
        <div id="voiceflow-hvac" style="height: 700px; border-radius: 20px; overflow: hidden; border: 1px solid var(--accent); max-width: 900px; margin: 0 auto;">
        </div>
    </section>

    <script type="text/javascript">
      (function(d, t) {
          var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
          v.onload = function() {
            window.voiceflow.chat.load({
              verify: { projectID: '69d466bf715c36f555fc4c44' },
              url: 'https://general-runtime.voiceflow.com',
              versionID: 'production',
              voice: {
                url: "https://runtime-api.voiceflow.com"
              },
              render: {
                mode: 'embedded',
                target: d.getElementById('voiceflow-hvac'),
              },
              autostart: true
            });
          }
          v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
          v.type = "text/javascript";
          s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>
</body>
</html>
